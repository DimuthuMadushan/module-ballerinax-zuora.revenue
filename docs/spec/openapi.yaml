  /api/integration/v1/{orgId}/programs/{programId}/submit:
    post:
      tags:
        - Revenue Jobs
      summary: Submit a program with specified parameters
      operationId: POST_SubmitRevenueJob
      description: |
        Submits a program in Zuora Revenue and returns the job ID.
      parameters:
        - in: path
          name: programId
          description: >-
            The ID of the program that is to be submitted in Zuora Revenue. You
            can get the program ID by using the "Get list of available programs
            and program parameters" operation.
          required: true
          schema:
            type: integer
        - in: path
          name: orgId
          description: >-
            The ID of the organization for which the program is to be submitted.
            You can get the organization ID by using the "Get list of available
            organizations" operation.
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
        description: >
          An array that contains the parameter values to be used for the
          program. For each parameter, you need to specify the parameter ID,
          sequence, and desired value.

          You can get the parameter name, ID, and sequence by using the "Get
          list of available programs and program parameters" operation.
        required: true
      responses:
        '200':
          description: The job status is returned with the job ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '400':
          description: The specified program is not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitJobFailureResponse'
        '403':
          description: >-
            The specified organization ID does not match the organization
            assigned to the current user role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitJobFailureResponse'
  /api/integration/v1/{orgId}/jobs/{jobId}:
    get:
      tags:
        - Revenue Jobs
      summary: Get the job status
      operationId: GET_RevenueJobStatus
      description: |
        Retrieves the status of a submitted job in Zuora Revenue.
      parameters:
        - in: path
          name: jobId
          description: The ID of the Zuora Revenue job whose status is queried. This is the job ID returned when the program was submitted
          required: true
          schema:
            type: integer
        - in: path
          name: orgId
          description: >-
            The ID of the organization that is specified when the job is
            submitted.
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The job status is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '400':
          description: The input parameter is invalid.
